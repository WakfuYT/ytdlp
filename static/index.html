<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Downloader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d11;
    --surface: #16161c;
    --line: #24242c;
    --text: #e6e6ea;
    --muted: #8b8b96;
    --accent: #4fd6a8;
    --accent-bg: #1c3a31;
    --danger: #ff8a8a;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    justify-content: center;
    padding: 0 20px;
  }
  main { width: 100%; max-width: 640px; padding-top: 18vh; }
  h1 { margin: 0; text-align: center; font-size: 34px; font-weight: 700; letter-spacing: -0.01em; }
  .sub { margin: 10px 0 32px; text-align: center; color: var(--muted); }

  .field {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid transparent;
    border-radius: 999px; padding: 6px 6px 6px 20px;
  }
  .field:focus-within { border-color: var(--accent); }
  .field input {
    flex: 1; min-width: 0; background: none; border: 0; outline: 0;
    color: var(--text); font: inherit; padding: 10px 0;
  }
  .field input::placeholder { color: var(--muted); }

  button { font: inherit; cursor: pointer; }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: .5; cursor: default; }
  .pill {
    background: var(--accent-bg); color: var(--accent); border: 0;
    border-radius: 999px; padding: 10px 22px; font-weight: 500;
  }

  .status { min-height: 22px; margin-top: 14px; text-align: center; color: var(--muted); font-size: 14px; }
  .status.error { color: var(--danger); }

  .card {
    margin-top: 24px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 14px; padding: 16px;
  }
  .card[hidden] { display: none; }
  .meta { display: flex; gap: 16px; }
  .thumb { position: relative; flex: none; width: 168px; aspect-ratio: 16 / 9; border-radius: 8px; overflow: hidden; background: var(--bg); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb span {
    position: absolute; right: 6px; bottom: 6px; background: rgba(0,0,0,.75);
    border-radius: 4px; padding: 1px 6px; font-size: 12px;
  }
  .info { min-width: 0; }
  .title { font-weight: 600; line-height: 1.35; margin: 0 0 6px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .by { color: var(--muted); font-size: 13px; }

  .row { display: flex; align-items: center; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { background: none; border: 0; color: var(--text); padding: 8px 16px; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #06231a; font-weight: 600; }
  select {
    background: var(--bg); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 12px; font: inherit;
  }
  .grow { flex: 1; }
  .go {
    background: var(--accent); color: #06231a; border: 0; border-radius: 999px;
    padding: 10px 22px; font-weight: 600;
  }

  @media (max-width: 520px) {
    main { padding-top: 10vh; }
    .meta { flex-direction: column; }
    .thumb { width: 100%; }
  }
</style>
</head>
<body>
<main>
  <h1>Video Downloader</h1>
  <p class="sub">Paste a video link, download instantly</p>

  <div class="field">
    <input id="url" type="url" placeholder="Enter video URL..." autocomplete="off" spellcheck="false" aria-label="Video URL">
    <button id="parse" class="pill">Parse</button>
  </div>
  <div id="status" class="status" role="status"></div>

  <section id="card" class="card" hidden>
    <div class="meta">
      <div class="thumb"><img id="thumb" alt=""><span id="dur"></span></div>
      <div class="info">
        <p id="title" class="title"></p>
        <div id="by" class="by"></div>
      </div>
    </div>
    <div class="row">
      <div class="seg" role="group" aria-label="Download type">
        <button id="m-video" aria-pressed="true">Video</button>
        <button id="m-audio" aria-pressed="false">Audio</button>
      </div>
      <select id="quality" aria-label="Quality"></select>
      <span class="grow"></span>
      <button id="download" class="go">Download</button>
    </div>
  </section>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const urlEl = $("url"), parseBtn = $("parse"), statusEl = $("status"), card = $("card");
  const qualityEl = $("quality"), dlBtn = $("download");
  let mode = "video";

  function setStatus(msg, isError) {
    statusEl.textContent = msg || "";
    statusEl.classList.toggle("error", !!isError);
  }
  function fmtTime(s) {
    if (!s) return "";
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    const pad = (n) => String(n).padStart(2, "0");
    return h ? `${h}:${pad(m)}:${pad(sec)}` : `${m}:${pad(sec)}`;
  }
  function fmtViews(n) {
    if (n == null) return "";
    return new Intl.NumberFormat("en", { notation: "compact", maximumFractionDigits: 1 }).format(n) + " views";
  }
  function setMode(m) {
    mode = m;
    $("m-video").setAttribute("aria-pressed", m === "video");
    $("m-audio").setAttribute("aria-pressed", m === "audio");
    qualityEl.hidden = m === "audio";
  }

  async function parse() {
    const url = urlEl.value.trim();
    if (!url) return setStatus("Paste a video link first.", true);
    parseBtn.disabled = true;
    card.hidden = true;
    setStatus("Reading video details...");
    try {
      const r = await fetch("/api/info", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url }),
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || "Could not read this link.");
      $("thumb").src = d.thumbnail || "";
      $("dur").textContent = fmtTime(d.duration);
      $("title").textContent = d.title || "Untitled";
      $("by").textContent = [d.uploader, fmtViews(d.views)].filter(Boolean).join("  |  ");
      qualityEl.innerHTML = '<option value="">Best available</option>' +
        d.heights.map((h) => `<option value="${h}">${h}p</option>`).join("");
      setMode("video");
      card.hidden = false;
      setStatus("");
    } catch (e) {
      setStatus(e.message, true);
    } finally {
      parseBtn.disabled = false;
    }
  }

  async function download() {
    dlBtn.disabled = true;
    setStatus("Preparing your file. Longer videos take a moment...");
    try {
      const q = new URLSearchParams({ url: urlEl.value.trim(), mode, height: qualityEl.value });
      const r = await fetch("/api/download?" + q);
      if (!r.ok) throw new Error((await r.json()).error || "Download failed.");
      const cd = r.headers.get("Content-Disposition") || "";
      const star = /filename\*=UTF-8''([^;]+)/i.exec(cd);
      const plain = /filename="?([^";]+)"?/i.exec(cd);
      const name = star ? decodeURIComponent(star[1]) : plain ? plain[1] : "download";
      const blob = await r.blob();
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 10000);
      setStatus("Download started.");
    } catch (e) {
      setStatus(e.message, true);
    } finally {
      dlBtn.disabled = false;
    }
  }

  parseBtn.addEventListener("click", parse);
  urlEl.addEventListener("keydown", (e) => { if (e.key === "Enter") parse(); });
  $("m-video").addEventListener("click", () => setMode("video"));
  $("m-audio").addEventListener("click", () => setMode("audio"));
  dlBtn.addEventListener("click", download);
</script>
</body>
</html>
